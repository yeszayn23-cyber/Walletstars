<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحفظة السحابية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ed;
            --card-bg: rgba(255, 255, 255, 0.94);
            --primary-brown: #4a3327;
            --light-brown: #8c6d59;
            --accent-beige: #e6dfd5;
            --soft-border: #dcd4c5;
            --text-color: #332219;
            --danger-color: #b73232;
            --shadow: 0 10px 30px rgba(74, 51, 39, 0.08);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 30px 22px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--soft-border);
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-brown);
            margin-bottom: 8px;
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--light-brown);
            margin-bottom: 25px;
        }

        input[type="text"], input[type="file"] {
            width: 90%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 2px solid var(--accent-beige);
            background-color: rgba(250, 248, 245, 0.9);
            color: var(--text-color);
            font-size: 15px;
            margin-bottom: 12px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-brown);
            background-color: #fff;
        }

        button {
            background-color: var(--primary-brown);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(74, 51, 39, 0.15);
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: #38251c;
        }

        .btn-danger {
            background-color: var(--danger-color);
            box-shadow: 0 4px 12px rgba(183, 50, 50, 0.15);
        }

        .btn-secondary {
            background-color: var(--accent-beige);
            color: var(--primary-brown);
            box-shadow: none;
        }

        .wallet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .wallet-box {
            background: linear-gradient(145deg, rgba(250, 248, 245, 0.9), rgba(243, 239, 230, 0.9));
            padding: 22px 12px;
            border-radius: 18px;
            border: 1px solid var(--soft-border);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wallet-box:hover {
            border-color: var(--primary-brown);
            transform: translateY(-3px);
        }

        .wallet-box h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: var(--primary-brown);
        }

        .wallet-box p {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-brown);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .counter-display {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary-brown);
            margin: 15px 0 5px 0;
        }

        .symbols-container {
            font-size: 20px;
            letter-spacing: 4px;
            margin: 20px 0;
            min-height: 45px;
            padding: 10px;
            background-color: rgba(250, 248, 245, 0.8);
            border-radius: 12px;
            border: 1px dashed var(--soft-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 12px;
            border: 1px solid var(--soft-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background-color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--accent-beige);
        }

        th {
            background-color: var(--accent-beige);
            color: var(--primary-brown);
            font-weight: 700;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .mini-btn {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 8px;
            width: auto;
            box-shadow: none;
            margin-top: 0;
        }

        .welcome-badge {
            display: inline-block;
            background-color: var(--accent-beige);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--primary-brown);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .bg-settings-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--soft-border);
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- شاشة تسجيل الاسم المؤقتة للعضوات الجدد -->
    <div id="login-screen" class="screen card">
        <div class="app-title">المحفظة</div>
        <div class="app-subtitle">أدخلي اسمكِ لمرة واحدة فقط للمتابعة</div>
        <input type="text" id="username-input" placeholder="اسمكِ هنا...">
        <button onclick="registerUser()">دخول سريع</button>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="main-screen" class="screen card">
        <div class="app-title">المحفظة</div>
        <div class="welcome-badge" id="welcome-user">أهلاً بكِ، <span></span></div>
        
        <div class="wallet-grid">
            <div class="wallet-box" onclick="switchScreen('stars-wallet')">
                <h3>⭐ النجوم</h3>
                <p id="preview-stars">0</p>
            </div>
            <div class="wallet-box" onclick="switchScreen('bans-wallet')">
                <h3>🔴 الإقصاءات</h3>
                <p id="preview-bans">0</p>
            </div>
        </div>

        <!-- إعدادات الخلفية -->
        <div class="bg-settings-box">
            <input type="file" id="bg-file-input" accept="image/*" onchange="previewAndSaveBg(event)">
            <button class="btn-secondary" onclick="removeBackground()">حذف الخلفية</button>
        </div>

        <!-- زر لوحة التحكم يظهر لك وحدك حصراً -->
        <div id="admin-panel-btn-container" class="hidden">
            <button style="background-color: var(--primary-brown);" onclick="switchScreen('admin-panel')">لوحة تحكم المالكة 👑</button>
        </div>
    </div>

    <!-- محفظة النجوم -->
    <div id="stars-wallet" class="screen card">
        <h2>⭐ محفظة النجوم</h2>
        <div class="counter-display" id="stars-count">0</div>
        <div class="symbols-container" id="stars-symbols"></div>
        <div id="stars-actions" style="display: flex; gap: 10px;" class="hidden">
            <button onclick="modifyStars(1)">إضافة نجمة ⭐</button>
            <button class="btn-danger" onclick="modifyStars(-1)">حذف</button>
        </div>
        <button class="btn-secondary" onclick="switchScreen('main-screen')">الرجوع للرئيسية</button>
    </div>

    <!-- محفظة الإقصاءات -->
    <div id="bans-wallet" class="screen card">
        <h2>🔴 محفظة الإقصاءات</h2>
        <div class="counter-display" id="bans-count">0</div>
        <div class="symbols-container" id="symbols-container-bans"></div>
        <div id="bans-actions" style="display: flex; gap: 10px;" class="hidden">
            <button class="btn-danger" onclick="modifyBans(1)">إضافة إقصاء 🔴</button>
            <button class="btn-secondary" onclick="modifyBans(-1)" style="margin-top:0;">حذف</button>
        </div>
        <button class="btn-secondary" onclick="switchScreen('main-screen')">الرجوع للرئيسية</button>
    </div>

    <!-- لوحة تحكم المالكة -->
    <div id="admin-panel" class="screen card">
        <h2>👑 لوحة التحكم</h2>
        <div class="app-subtitle">متابعة العضوات والتحكم الشامل</div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>النجوم</th>
                        <th>الإقصاءات</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="4" style="color: var(--light-brown);">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
        <button class="btn-secondary" onclick="switchScreen('main-screen')">الرجوع للرئيسية</button>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const ADMIN_ID = "8421694319";
    const ADMIN_USERNAME = "zay_yes3d";

    let myId = "";
    let myUsername = "";
    let currentUserName = localStorage.getItem('wallet_user_name') || "";
    let allUsers = {};
    let isAdmin = false;

    const firebaseConfig = {
        apiKey: "AIzaSyDZsmaDCvrVzplI01FOaPdRAXfZ5psYabE",
        authDomain: "mywallet-11d29.firebaseapp.com",
        databaseURL: "https://mywallet-11d29-default-rtdb.firebaseio.com",
        projectId: "mywallet-11d29",
        storageBucket: "mywallet-11d29.firebasestorage.app",
        messagingSenderId: "249088283797",
        appId: "1:249088283797:web:707c46388467c346b7379c",
        measurementId: "G-LQFQ15FFZJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, "https://mywallet-11d29-default-rtdb.firebaseio.com/");

    window.onload = function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                myId = String(window.Telegram.WebApp.initDataUnsafe.user.id || "");
                myUsername = String(window.Telegram.WebApp.initDataUnsafe.user.username || "").toLowerCase();
            }
        }

        // التحقق الحصري للمالكة بناءً على الآيدي أو اليوزر الدقيق
        if (myId === ADMIN_ID || myUsername === ADMIN_USERNAME.toLowerCase()) {
            isAdmin = true;
            currentUserName = "زينب (المالكة)";
            localStorage.setItem('wallet_user_name', currentUserName);
        }

        // تحميل الخلفية الخاصة
        const localBg = localStorage.getItem('wallet_bg');
        if (localBg) applyBg(localBg);

        // جلب البيانات بخفة وسرعة فائقة
        onValue(ref(db), (snapshot) => {
            const data = snapshot.val() || {};
            allUsers = data.users || {};

            if (data.globalBackground && !localBg) {
                applyBg(data.globalBackground);
            }

            if (currentUserName) {
                if (!allUsers[currentUserName]) {
                    allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
                    saveDataToCloud();
                }
                showMainScreen();
            } else {
                document.getElementById('login-screen').classList.add('active');
            }
        }, { onlyOnce: false });
    };

    async function saveDataToCloud() {
        try {
            set(ref(db, 'users'), allUsers);
        } catch (e) {}
    }

    window.registerUser = function() {
        const input = document.getElementById('username-input').value.trim();
        if (!input) {
            alert("الرجاء إدخال الاسم!");
            return;
        }
        currentUserName = input;
        localStorage.setItem('wallet_user_name', currentUserName);

        if (!allUsers[currentUserName]) {
            allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
            saveDataToCloud();
        }
        showMainScreen();
    }

    function showMainScreen() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('main-screen').classList.add('active');
        document.querySelector('#welcome-user span').innerText = currentUserName;

        if (isAdmin) {
            document.getElementById('admin-panel-btn-container').classList.remove('hidden');
            document.getElementById('stars-actions').classList.remove('hidden');
            document.getElementById('bans-actions').classList.remove('hidden');
        } else {
            document.getElementById('admin-panel-btn-container').classList.add('hidden');
            document.getElementById('stars-actions').classList.add('hidden');
            document.getElementById('bans-actions').classList.add('hidden');
        }
        updatePreviews();
    }

    window.switchScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');

        if (screenId === 'stars-wallet') updateStarsUI();
        if (screenId === 'bans-wallet') updateBansUI();
        if (screenId === 'admin-panel' && isAdmin) renderAdminTable();
        if (screenId === 'main-screen') updatePreviews();
    }

    window.modifyStars = async function(amount) {
        if (!isAdmin) return;
        if (!allUsers[currentUserName]) allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
        allUsers[currentUserName].stars = Math.max(0, allUsers[currentUserName].stars + amount);
        updateStarsUI();
        updatePreviews();
        saveDataToCloud();
    }

    window.modifyBans = async function(amount) {
        if (!isAdmin) return;
        if (!allUsers[currentUserName]) allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
        allUsers[currentUserName].bans = Math.max(0, allUsers[currentUserName].bans + amount);
        updateBansUI();
        updatePreviews();
        saveDataToCloud();
    }

    function updateStarsUI() {
        let u = allUsers[currentUserName] || { stars: 0 };
        document.getElementById('stars-count').innerText = u.stars;
        document.getElementById('stars-symbols').innerText = u.stars > 0 ? "⭐".repeat(u.stars) : "لا توجد نجوم بعد";
    }

    function updateBansUI() {
        let u = allUsers[currentUserName] || { bans: 0 };
        document.getElementById('bans-count').innerText = u.bans;
        document.getElementById('symbols-container-bans').innerText = u.bans > 0 ? "🔴".repeat(u.bans) : "سجل نظيف تماماً";
    }

    function updatePreviews() {
        let u = allUsers[currentUserName] || { stars: 0, bans: 0 };
        document.getElementById('preview-stars').innerText = u.stars;
        document.getElementById('preview-bans').innerText = u.bans;
    }

    function renderAdminTable() {
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = "";
        const keys = Object.keys(allUsers);
        
        if (keys.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color: var(--light-brown);">لا توجد عضوات</td></tr>`;
            return;
        }

        keys.forEach((name) => {
            const user = allUsers[name];
            tbody.innerHTML += `<tr>
                <td><strong>${user.name}</strong></td>
                <td>⭐ ${user.stars}</td>
                <td>🔴 ${user.bans}</td>
                <td>
                    <div class="action-btns">
                        <button class="btn-secondary mini-btn" onclick="resetUser('${name}')">🔄</button>
                        <button class="btn-danger mini-btn" onclick="deleteUser('${name}')">❌</button>
                    </div>
                </td>
            </tr>`;
        });
    }

    window.resetUser = function(name) {
        if (!isAdmin) return;
        if (allUsers[name]) {
            allUsers[name].stars = 0;
            allUsers[name].bans = 0;
            saveDataToCloud();
            renderAdminTable();
        }
    }

    window.deleteUser = function(name) {
        if (!isAdmin) return;
        if (confirm(`حذف ${name}؟`)) {
            delete allUsers[name];
            saveDataToCloud();
            renderAdminTable();
        }
    }

    window.previewAndSaveBg = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result;
            localStorage.setItem('wallet_bg', base64);
            applyBg(base64);
            
            if (isAdmin && confirm("تطبيق الخلفية للجميع في السحابة؟")) {
                set(ref(db, 'globalBackground'), base64);
            }
            alert("تم حفظ الخلفية بنجاح!");
        };
        reader.readAsDataURL(file);
    }

    window.removeBackground = function() {
        localStorage.removeItem('wallet_bg');
        document.body.style.backgroundImage = "none";
        if (isAdmin) set(ref(db, 'globalBackground'), null);
        alert("تمت الإزالة.");
    }

    function applyBg(url) {
        document.body.style.backgroundImage = `url('${url}')`;
    }
</script>

</body>
</html>
