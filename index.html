<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحفظة</title>
    <!-- تضمين مكتبة تليجرام الرسمية للتعرف على يوزر المستخدمة الحقيقي -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f5f2eb;
            --card-bg: #ffffff;
            --primary-brown: #5c4033;
            --light-brown: #8d6e63;
            --accent-beige: #d7ccc8;
            --text-color: #3e2723;
            --danger-color: #c62828;
            --star-color: #fbc02d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(92, 64, 51, 0.08);
            text-align: center;
            border: 1px solid #e7e0d8;
        }

        h2, h3 {
            color: var(--primary-brown);
        }

        input[type="text"] {
            width: 85%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--accent-beige);
            background-color: #faf8f5;
            color: var(--text-color);
            font-size: 16px;
            margin-top: 15px;
            text-align: center;
            outline: none;
        }

        button {
            background-color: var(--primary-brown);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(92, 64, 51, 0.2);
        }

        button:hover {
            background-color: var(--light-brown);
        }

        .btn-danger {
            background-color: var(--danger-color);
        }

        .btn-secondary {
            background-color: var(--accent-beige);
            color: var(--primary-brown);
            box-shadow: none;
        }

        .wallet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .wallet-box {
            background-color: #faf8f5;
            padding: 20px 15px;
            border-radius: 16px;
            border: 2px solid var(--accent-beige);
            cursor: pointer;
            transition: 0.3s;
        }

        .wallet-box:hover {
            border-color: var(--primary-brown);
        }

        .hidden {
            display: none !important;
        }

        .counter-display {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-brown);
            margin: 10px 0;
        }

        .symbols-container {
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            min-height: 35px;
            word-break: break-all;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #e7e0d8;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: var(--accent-beige);
            color: var(--primary-brown);
        }

        .app-title {
            font-size: 26px;
            font-weight: bold;
            color: var(--primary-brown);
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- شاشة تسجيل الاسم (تظهر للمرة الأولى فقط للمستخدمات الجدد) -->
    <div id="login-screen" class="card hidden">
        <div class="app-title">المحفظة</div>
        <p style="color: var(--light-brown);">مرحباً بكِ في بوت المحفظة المصغر</p>
        <p>الرجاء إدخال اسمكِ للمتابعة:</p>
        <input type="text" id="username-input" placeholder="اكتبي اسمكِ هنا...">
        <br>
        <button onclick="registerUser()">دخول</button>
    </div>

    <!-- الشاشة الرئيسية للمستخدمة -->
    <div id="main-screen" class="card hidden">
        <div class="app-title">المحفظة</div>
        <h2 id="welcome-user" style="margin-top: 5px;">أهلاً بكِ، <span></span></h2>
        
        <div class="wallet-grid">
            <div class="wallet-box" onclick="openWallet('stars')">
                <h3>⭐ النجوم</h3>
                <p id="preview-stars" style="font-weight: bold; font-size: 18px;">0</p>
            </div>
            <div class="wallet-box" onclick="openWallet('bans')">
                <h3>🔴 الإقصاءات</h3>
                <p id="preview-bans" style="font-weight: bold; font-size: 18px;">0</p>
            </div>
        </div>

        <!-- زر لوحة التحكم يظهر حصرياً للمالكة بناءً على الـ ID -->
        <div id="admin-panel-btn-container" class="hidden">
            <button style="background-color: var(--primary-brown); width: 100%; margin-top: 20px;" onclick="openAdminPanel()">لوحة تحكم المالكة 👑</button>
        </div>
    </div>

    <!-- واجهة محفظة النجوم -->
    <div id="stars-wallet" class="card hidden">
        <h2>⭐ محفظة النجوم</h2>
        <div class="counter-display" id="stars-count">0</div>
        <div class="symbols-container" id="stars-symbols"></div>
        <button onclick="modifyStars(1)">إضافة نجمة ⭐</button>
        <button class="btn-danger" onclick="modifyStars(-1)">حذف نجمة</button>
        <br><br>
        <button class="btn-secondary" onclick="goBack()">الرجوع</button>
    </div>

    <!-- واجهة محفظة الإقصاءات -->
    <div id="bans-wallet" class="card hidden">
        <h2>🔴 محفظة الإقصاءات</h2>
        <div class="counter-display" id="bans-count">0</div>
        <div class="symbols-container" id="bans-symbols"></div>
        <button class="btn-danger" onclick="modifyBans(1)">إضافة إقصاء 🔴</button>
        <button class="btn-secondary" onclick="modifyBans(-1)">حذف إقصاء</button>
        <br><br>
        <button class="btn-secondary" onclick="goBack()">الرجوع</button>
    </div>

    <!-- لوحة تحكم المالكة -->
    <div id="admin-panel" class="card hidden">
        <h2>👑 لوحة تحكم المالكة</h2>
        <p style="font-size: 13px; color: var(--light-brown);">جدول متابعة العضوات المسجلات:</p>
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>النجوم</th>
                    <th>الإقصاءات</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
        </table>
        <br>
        <button class="btn-secondary" onclick="goBack()">الرجوع</button>
    </div>

</div>

<script>
    // اليوزر الخاص بكِ كمالكة
    const ADMIN_ID = "8421694319";
    
    let currentTelegramId = "";
    let currentUserName = "";
    let currentUser = null;

    // قاعدة بيانات حقيقية تبدأ فارغة تماماً بدون أي أسماء وهمية
    let allUsers = JSON.parse(localStorage.getItem('wallet_all_users')) || [];

    window.onload = function() {
        // تهيئة تطبيق تليجرام للتأكد من الهوية الحقيقية
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                currentTelegramId = tgUser.id.toString();
            }
        }

        // التحقق مما إذا كان الاسم محفوظاً مسبقاً في الذاكرة المحلية
        let savedName = localStorage.getItem('wallet_current_user_name');

        if (!savedName) {
            // إذا لم تقم بتسجيل اسمها من قبل، نطلب منها إدخاله للمرة الأولى فقط
            document.getElementById('login-screen').classList.remove('hidden');
        } else {
            // إذا كان محفوظاً، ندخلها مباشرة دون إزعاجها
            setupUserSession(savedName);
        }
    };

    function registerUser() {
        const inputName = document.getElementById('username-input').value.trim();
        if (!inputName) {
            alert("الرجاء إدخال الاسم!");
            return;
        }
        localStorage.setItem('wallet_current_user_name', inputName);
        setupUserSession(inputName);
    }

    function setupUserSession(name) {
        currentUserName = name;
        
        // البحث عن المستخدمة في قاعدة البيانات
        currentUser = allUsers.find(u => u.name === currentUserName);
        if (!currentUser) {
            // إذا دخلت لأول مرة يتم إضافتها للقائمة الحقيقية
            currentUser = { name: currentUserName, stars: 0, bans: 0 };
            allUsers.push(currentUser);
            saveData();
        }

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        document.querySelector('#welcome-user span').innerText = currentUser.name;

        // إظهار زر لوحة التحكم حصرياً لكِ بناءً على الـ ID الخاص بكِ
        if (currentTelegramId === ADMIN_ID) {
            document.getElementById('admin-panel-btn-container').classList.remove('hidden');
        }

        updatePreviews();
    }

    function openWallet(type) {
        document.getElementById('main-screen').classList.add('hidden');
        if (type === 'stars') {
            document.getElementById('stars-wallet').classList.remove('hidden');
            updateStarsUI();
        } else {
            document.getElementById('bans-wallet').classList.remove('hidden');
            updateBansUI();
        }
    }

    function modifyStars(amount) {
        currentUser.stars += amount;
        if (currentUser.stars < 0) currentUser.stars = 0;
        updateStarsUI();
        updatePreviews();
        syncUserData();
    }

    function modifyBans(amount) {
        currentUser.bans += amount;
        if (currentUser.bans < 0) currentUser.bans = 0;
        updateBansUI();
        updatePreviews();
        syncUserData();
    }

    function updateStarsUI() {
        document.getElementById('stars-count').innerText = currentUser.stars;
        document.getElementById('stars-symbols').innerText = "⭐".repeat(currentUser.stars);
    }

    function updateBansUI() {
        document.getElementById('bans-count').innerText = currentUser.bans;
        document.getElementById('bans-symbols').innerText = "🔴".repeat(currentUser.bans);
    }

    function updatePreviews() {
        document.getElementById('preview-stars').innerText = currentUser.stars;
        document.getElementById('preview-bans').innerText = currentUser.bans;
    }

    function goBack() {
        document.getElementById('stars-wallet').classList.add('hidden');
        document.getElementById('bans-wallet').classList.add('hidden');
        document.getElementById('admin-panel').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        updatePreviews();
    }

    function openAdminPanel() {
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        renderAdminTable();
    }

    function renderAdminTable() {
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = "";
        
        if (allUsers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color: var(--light-brown);">لا توجد عضوات مسجلات حتى الآن</td></tr>`;
            return;
        }

        allUsers.forEach((user, index) => {
            tbody.innerHTML += `<tr>
                <td>${user.name}</td>
                <td>⭐ ${user.stars}</td>
                <td>🔴 ${user.bans}</td>
                <td><button class="btn-danger" style="padding: 5px 10px; font-size: 12px; margin: 0;" onclick="resetUser(${index})">تصفير</button></td>
            </tr>`;
        });
    }

    function resetUser(index) {
        if (confirm(`هل أنتِ متأكدة من تصفير عدادات العضوة: ${allUsers[index].name}؟`)) {
            allUsers[index].stars = 0;
            allUsers[index].bans = 0;
            saveData();
            renderAdminTable();
            if (allUsers[index].name === currentUser.name) {
                currentUser = allUsers[index];
                updatePreviews();
            }
        }
    }

    function syncUserData() {
        let index = allUsers.findIndex(u => u.name === currentUser.name);
        if (index !== -1) {
            allUsers[index] = currentUser;
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem('wallet_all_users', JSON.stringify(allUsers));
    }
</script>

</body>
</html>
