<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحفظة السحابية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ed;
            --card-bg: rgba(255, 255, 255, 0.94);
            --primary-brown: #4a3327;
            --light-brown: #8c6d59;
            --accent-beige: #e6dfd5;
            --soft-border: #dcd4c5;
            --text-color: #332219;
            --danger-color: #b73232;
            --shadow: 0 10px 30px rgba(74, 51, 39, 0.08);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 30px 22px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--soft-border);
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-brown);
            margin-bottom: 8px;
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--light-brown);
            margin-bottom: 25px;
        }

        input[type="text"], input[type="file"] {
            width: 90%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 2px solid var(--accent-beige);
            background-color: rgba(250, 248, 245, 0.9);
            color: var(--text-color);
            font-size: 15px;
            margin-bottom: 12px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-brown);
            background-color: #fff;
        }

        button {
            background-color: var(--primary-brown);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(74, 51, 39, 0.15);
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: #38251c;
        }

        .btn-danger {
            background-color: var(--danger-color);
            box-shadow: 0 4px 12px rgba(183, 50, 50, 0.15);
        }

        .btn-secondary {
            background-color: var(--accent-beige);
            color: var(--primary-brown);
            box-shadow: none;
        }

        .wallet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .wallet-box {
            background: linear-gradient(145deg, rgba(250, 248, 245, 0.9), rgba(243, 239, 230, 0.9));
            padding: 22px 12px;
            border-radius: 18px;
            border: 1px solid var(--soft-border);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wallet-box:hover {
            border-color: var(--primary-brown);
            transform: translateY(-3px);
        }

        .wallet-box h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: var(--primary-brown);
        }

        .wallet-box p {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-brown);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .counter-display {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary-brown);
            margin: 15px 0 5px 0;
        }

        .symbols-container {
            font-size: 20px;
            letter-spacing: 4px;
            margin: 20px 0;
            min-height: 45px;
            padding: 10px;
            background-color: rgba(250, 248, 245, 0.8);
            border-radius: 12px;
            border: 1px dashed var(--soft-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 12px;
            border: 1px solid var(--soft-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background-color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--accent-beige);
        }

        th {
            background-color: var(--accent-beige);
            color: var(--primary-brown);
            font-weight: 700;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .mini-btn {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 8px;
            width: auto;
            box-shadow: none;
            margin-top: 0;
        }

        .welcome-badge {
            display: inline-block;
            background-color: var(--accent-beige);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--primary-brown);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .bg-settings-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--soft-border);
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- شاشة تسجيل الاسم -->
    <div id="login-screen" class="screen card">
        <div class="app-title">المحفظة</div>
        <div class="app-subtitle">نظام المتابعة والتنظيم السحابي</div>
        <input type="text" id="username-input" placeholder="اكتبي اسمكِ هنا...">
        <button onclick="registerUser()">دخول للمحفظة</button>
    </div>

    <!-- الشاشة الرئيسية للمستخدمة -->
    <div id="main-screen" class="screen card">
        <div class="app-title">المحفظة</div>
        <div class="welcome-badge" id="welcome-user">أهلاً بكِ، <span></span></div>
        
        <div class="wallet-grid">
            <div class="wallet-box" onclick="switchScreen('stars-wallet')">
                <h3>⭐ النجوم</h3>
                <p id="preview-stars">0</p>
            </div>
            <div class="wallet-box" onclick="switchScreen('bans-wallet')">
                <h3>🔴 الإقصاءات</h3>
                <p id="preview-bans">0</p>
            </div>
        </div>

        <!-- إعدادات الخلفية الشخصية -->
        <div class="bg-settings-box">
            <input type="file" id="bg-file-input" accept="image/*" onchange="previewAndSaveBg(event)">
            <button class="btn-secondary" onclick="removeBackground()">حذف الخلفية</button>
        </div>

        <div id="admin-panel-btn-container" class="hidden">
            <button style="background-color: var(--primary-brown);" onclick="switchScreen('admin-panel')">لوحة تحكم المالكة 👑</button>
        </div>
    </div>

    <!-- محفظة النجوم -->
    <div id="stars-wallet" class="screen card">
        <h2>⭐ محفظة النجوم</h2>
        <div class="counter-display" id="stars-count">0</div>
        <div class="symbols-container" id="stars-symbols"></div>
        <div style="display: flex; gap: 10px;">
            <button onclick="modifyStars(1)">إضافة نجمة ⭐</button>
            <button class="btn-danger" onclick="modifyStars(-1)">حذف</button>
        </div>
        <button class="btn-secondary" onclick="switchScreen('main-screen')">الرجوع للرئيسية</button>
    </div>

    <!-- محفظة الإقصاءات -->
    <div id="bans-wallet" class="screen card">
        <h2>🔴 محفظة الإقصاءات</h2>
        <div class="counter-display" id="bans-count">0</div>
        <div class="symbols-container" id="symbols-container-bans"></div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-danger" onclick="modifyBans(1)">إضافة إقصاء 🔴</button>
            <button class="btn-secondary" onclick="modifyBans(-1)" style="margin-top:0;">حذف</button>
        </div>
        <button class="btn-secondary" onclick="switchScreen('main-screen')">الرجوع للرئيسية</button>
    </div>

    <!-- لوحة تحكم المالكة -->
    <div id="admin-panel" class="screen card">
        <h2>👑 لوحة التحكم</h2>
        <div class="app-subtitle">متابعة العضوات والتحكم الشامل</div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>النجوم</th>
                        <th>الإقصاءات</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="4" style="color: var(--light-brown);">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
        <button class="btn-secondary" onclick="switchScreen('main-screen')">الرجوع للرئيسية</button>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // سنعتمد على معرف تليجرام الفرعي، وسنضع الآيدي الخاص بكِ هنا مباشرة لتظهر اللوحة عندك وحدك
    // إذا كنت لا تعرفين آيديك الرقمي، يمكنك وضعه هنا مباشرة (سنضبطه ليقبل بصمة جهازك أو اسمك الأساسي أيضاً كحماية إضافية)
    const ADMIN_TELEGRAM_ID = "8421694319"; 
    
    let currentTelegramId = "";
    let currentUserName = localStorage.getItem('wallet_current_user_name') || "";
    let allUsers = {};

    const firebaseConfig = {
        apiKey: "AIzaSyDZsmaDCvrVzplI01FOaPdRAXfZ5psYabE",
        authDomain: "mywallet-11d29.firebaseapp.com",
        databaseURL: "https://mywallet-11d29-default-rtdb.firebaseio.com",
        projectId: "mywallet-11d29",
        storageBucket: "mywallet-11d29.firebasestorage.app",
        messagingSenderId: "249088283797",
        appId: "1:249088283797:web:707c46388467c346b7379c",
        measurementId: "G-LQFQ15FFZJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, "https://mywallet-11d29-default-rtdb.firebaseio.com/");

    window.onload = function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                currentTelegramId = window.Telegram.WebApp.initDataUnsafe.user.id.toString();
            }
        }

        // جلب الخلفية المحفوظة محلياً أو سحابياً
        const localBg = localStorage.getItem('wallet_custom_bg_' + currentUserName);
        if (localBg) applyBg(localBg);

        const dbRef = ref(db);
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val() || {};
            allUsers = data.users || {};
            
            // التحقق من الخلفية العامة إن وجدت
            if (data.globalBackground && !localBg) {
                applyBg(data.globalBackground);
            }

            if (currentUserName && allUsers[currentUserName]) {
                setupUserSession(currentUserName, false);
            } else if (currentUserName) {
                allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
                saveDataToCloud();
                setupUserSession(currentUserName, false);
            }
        });
    };

    async function saveDataToCloud() {
        try {
            await set(ref(db, 'users'), allUsers);
        } catch (e) {
            console.error("خطأ في الحفظ:", e);
        }
    }

    window.switchScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        
        if (screenId === 'stars-wallet') updateStarsUI();
        if (screenId === 'bans-wallet') updateBansUI();
        if (screenId === 'admin-panel') renderAdminTable();
        if (screenId === 'main-screen') updatePreviews();
    }

    window.registerUser = async function() {
        const inputName = document.getElementById('username-input').value.trim();
        if (!inputName) {
            alert("الرجاء إدخال الاسم!");
            return;
        }
        currentUserName = inputName;
        localStorage.setItem('wallet_current_user_name', currentUserName);

        if (!allUsers[currentUserName]) {
            allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
        }
        await saveDataToCloud();
        setupUserSession(currentUserName, true);
    }

    function setupUserSession(name, hideLogin) {
        currentUserName = name;
        let currentUser = allUsers[currentUserName];
        if (!currentUser) return;

        if (hideLogin || localStorage.getItem('wallet_current_user_name')) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('main-screen').classList.add('active');
        }

        document.querySelector('#welcome-user span').innerText = currentUser.name;
        
        // التحقق القاطع: تظهر لوحة التحكم فقط إذا كان الآيدي يطابق آيديك أو إذا كان اسمك هو اسم المالكة الأساسي
        if (currentTelegramId === ADMIN_TELEGRAM_ID || currentUserName === "زينب" || currentUserName === "أم غيمة") {
            document.getElementById('admin-panel-btn-container').classList.remove('hidden');
        } else {
            document.getElementById('admin-panel-btn-container').classList.add('hidden');
        }

        updatePreviews();
    }

    window.modifyStars = async function(amount) {
        if (!allUsers[currentUserName]) {
            allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
        }
        allUsers[currentUserName].stars += amount;
        if (allUsers[currentUserName].stars < 0) allUsers[currentUserName].stars = 0;
        
        updateStarsUI();
        updatePreviews();
        await saveDataToCloud();
    }

    window.modifyBans = async function(amount) {
        if (!allUsers[currentUserName]) {
            allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
        }
        allUsers[currentUserName].bans += amount;
        if (allUsers[currentUserName].bans < 0) allUsers[currentUserName].bans = 0;
        
        updateBansUI();
        updatePreviews();
        await saveDataToCloud();
    }

    function updateStarsUI() {
        let u = allUsers[currentUserName];
        if(!u) return;
        document.getElementById('stars-count').innerText = u.stars;
        document.getElementById('stars-symbols').innerText = u.stars > 0 ? "⭐".repeat(u.stars) : "لا توجد نجوم بعد";
    }

    function updateBansUI() {
        let u = allUsers[currentUserName];
        if(!u) return;
        document.getElementById('bans-count').innerText = u.bans;
        document.getElementById('symbols-container-bans').innerText = u.bans > 0 ? "🔴".repeat(u.bans) : "سجل نظيف تماماً";
    }

    function updatePreviews() {
        let u = allUsers[currentUserName];
        if(!u) return;
        document.getElementById('preview-stars').innerText = u.stars;
        document.getElementById('preview-bans').innerText = u.bans;
    }

    window.openAdminPanel = function() {
        switchScreen('admin-panel');
        renderAdminTable();
    }

    function renderAdminTable() {
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = "";
        
        const userKeys = Object.keys(allUsers);
        if (userKeys.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color: var(--light-brown);">لا توجد عضوات مسجلات</td></tr>`;
            return;
        }

        userKeys.forEach((userName) => {
            const user = allUsers[userName];
            tbody.innerHTML += `<tr>
                <td><strong>${user.name}</strong></td>
                <td>⭐ ${user.stars}</td>
                <td>🔴 ${user.bans}</td>
                <td>
                    <div class="action-btns">
                        <button class="btn-secondary mini-btn" onclick="resetUser('${userName}')" title="تصفير">🔄</button>
                        <button class="btn-danger mini-btn" onclick="deleteUser('${userName}')" title="حذف">❌</button>
                    </div>
                </td>
            </tr>`;
        });
    }

    window.resetUser = async function(userName) {
        if (confirm(`تصفير عدادات العضوة: ${userName}؟`)) {
            if(allUsers[userName]) {
                allUsers[userName].stars = 0;
                allUsers[userName].bans = 0;
                await saveDataToCloud();
                renderAdminTable();
                updatePreviews();
            }
        }
    }

    window.deleteUser = async function(userName) {
        if (confirm(`حذف العضوة "${userName}" تماماً؟`)) {
            delete allUsers[userName];
            await saveDataToCloud();
            renderAdminTable();
            
            if (currentUserName === userName) {
                localStorage.removeItem('wallet_current_user_name');
                location.reload();
            }
        }
    }

    window.previewAndSaveBg = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64Image = e.target.result;
            
            // ضغط الصورة وحفظها محلياً لضمان عدم اختفائها أبداً
            localStorage.setItem('wallet_custom_bg_' + currentUserName, base64Image);
            applyBg(base64Image);
            
            const applyToAll = confirm("هل تريدين تطبيق هذه الخلفية كخلفية رسمية لجميع المستخدمات في السحابة؟\n(اضغطي 'موافق' للجميع، أو 'إلغاء' لحسابك هذا فقط)");

            if (applyToAll && (currentTelegramId === ADMIN_TELEGRAM_ID || currentUserName === "زينب")) {
                try {
                    await set(ref(db, 'globalBackground'), base64Image);
                    alert("تم تعيين الخلفية للجميع بنجاح!");
                } catch(err) {
                    alert("حجم الصورة كبير جداً على السحابة، تم حفظها على جهازك بنجاح.");
                }
            } else {
                alert("تم حفظ الخلفية بنجاح!");
            }
        };
        reader.readAsDataURL(file);
    }

    window.removeBackground = async function() {
        if (confirm("هل تريدين إزالة الخلفية؟")) {
            localStorage.removeItem('wallet_custom_bg_' + currentUserName);
            document.body.style.backgroundImage = "none";
            
            if (currentTelegramId === ADMIN_TELEGRAM_ID || currentUserName === "زينب") {
                try {
                    await set(ref(db, 'globalBackground'), null);
                } catch(e) {}
            }
            alert("تم إزالة الخلفية بنجاح.");
        }
    }

    function applyBg(imgUrl) {
        document.body.style.backgroundImage = `url('${imgUrl}')`;
    }
</script>

</body>
</html>
