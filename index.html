<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحفظة السحابية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ed;
            --card-bg: #ffffff;
            --primary-brown: #4a3327;
            --light-brown: #8c6d59;
            --accent-beige: #e6dfd5;
            --soft-border: #dcd4c5;
            --text-color: #332219;
            --danger-color: #b73232;
            --star-gold: #d4a373;
            --shadow: 0 10px 30px rgba(74, 51, 39, 0.06);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px 22px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--soft-border);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-brown);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--light-brown);
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 90%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid var(--accent-beige);
            background-color: #faf8f5;
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-brown);
            background-color: #fff;
        }

        button {
            background-color: var(--primary-brown);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(74, 51, 39, 0.15);
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: #38251c;
        }

        .btn-danger {
            background-color: var(--danger-color);
            box-shadow: 0 4px 12px rgba(183, 50, 50, 0.15);
        }

        .btn-danger:hover {
            background-color: #992828;
        }

        .btn-secondary {
            background-color: var(--accent-beige);
            color: var(--primary-brown);
            box-shadow: none;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #d4cbc0;
        }

        /* تنسيق شبكة المحافظ */
        .wallet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .wallet-box {
            background: linear-gradient(145deg, #faf8f5, #f3efe6);
            padding: 22px 12px;
            border-radius: 18px;
            border: 1px solid var(--soft-border);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .wallet-box:hover {
            border-color: var(--primary-brown);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(74, 51, 39, 0.08);
        }

        .wallet-box h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: var(--primary-brown);
        }

        .wallet-box p {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-brown);
        }

        .hidden {
            display: none !important;
        }

        .counter-display {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary-brown);
            margin: 15px 0 5px 0;
        }

        .symbols-container {
            font-size: 20px;
            letter-spacing: 4px;
            margin: 20px 0;
            min-height: 45px;
            padding: 10px;
            background-color: #faf8f5;
            border-radius: 12px;
            border: 1px dashed var(--soft-border);
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* جدول لوحة التحكم */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 12px;
            border: 1px solid var(--soft-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background-color: white;
            text-align: center;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--accent-beige);
        }

        th {
            background-color: var(--accent-beige);
            color: var(--primary-brown);
            font-weight: 700;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .mini-btn {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 8px;
            width: auto;
            box-shadow: none;
        }

        .welcome-badge {
            display: inline-block;
            background-color: var(--accent-beige);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--primary-brown);
            margin-bottom: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- شاشة تسجيل الاسم -->
    <div id="login-screen" class="card">
        <div class="app-title">المحفظة</div>
        <div class="app-subtitle">نظام المتابعة والتنظيم السحابي</div>
        <input type="text" id="username-input" placeholder="اكتبي اسمكِ هنا...">
        <button onclick="registerUser()">دخول للمحفظة</button>
    </div>

    <!-- الشاشة الرئيسية للمستخدمة -->
    <div id="main-screen" class="card hidden">
        <div class="app-title">المحفظة</div>
        <div class="welcome-badge" id="welcome-user">أهلاً بكِ، <span></span></div>
        
        <div class="wallet-grid">
            <div class="wallet-box" onclick="openWallet('stars')">
                <h3>⭐ النجوم</h3>
                <p id="preview-stars">0</p>
            </div>
            <div class="wallet-box" onclick="openWallet('bans')">
                <h3>🔴 الإقصاءات</h3>
                <p id="preview-bans">0</p>
            </div>
        </div>

        <div id="admin-panel-btn-container" class="hidden">
            <button style="margin-top: 20px;" onclick="openAdminPanel()">لوحة تحكم المالكة 👑</button>
        </div>
    </div>

    <!-- محفظة النجوم -->
    <div id="stars-wallet" class="card hidden">
        <h2>⭐ محفظة النجوم</h2>
        <div class="counter-display" id="stars-count">0</div>
        <div class="symbols-container" id="stars-symbols"></div>
        <div style="display: flex; gap: 10px;">
            <button onclick="modifyStars(1)">إضافة نجمة ⭐</button>
            <button class="btn-danger" onclick="modifyStars(-1)">حذف</button>
        </div>
        <button class="btn-secondary" onclick="goBack()">الرجوع للرئيسية</button>
    </div>

    <!-- محفظة الإقصاءات -->
    <div id="bans-wallet" class="card hidden">
        <h2>🔴 محفظة الإقصاءات</h2>
        <div class="counter-display" id="bans-count">0</div>
        <div class="symbols-container" id="symbols-container-bans"></div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-danger" onclick="modifyBans(1)">إضافة إقصاء 🔴</button>
            <button class="btn-secondary" onclick="modifyBans(-1)" style="margin-top:0;">حذف</button>
        </div>
        <button class="btn-secondary" onclick="goBack()">الرجوع للرئيسية</button>
    </div>

    <!-- لوحة تحكم المالكة -->
    <div id="admin-panel" class="card hidden">
        <h2>👑 لوحة التحكم</h2>
        <div class="app-subtitle">متابعة العضوات والتحكم الشامل</div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>النجوم</th>
                        <th>الإقصاءات</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="4" style="color: var(--light-brown);">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
        <button class="btn-secondary" onclick="goBack()">الرجوع للرئيسية</button>
    </div>

</div>

<!-- سكربت Firebase والمنطق البرمجي -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const ADMIN_ID = "8421694319";
    let currentTelegramId = "";
    let currentUserName = localStorage.getItem('wallet_current_user_name') || "";
    let allUsers = {};

    const firebaseConfig = {
        apiKey: "AIzaSyDZsmaDCvrVzplI01FOaPdRAXfZ5psYabE",
        authDomain: "mywallet-11d29.firebaseapp.com",
        databaseURL: "https://mywallet-11d29-default-rtdb.firebaseio.com",
        projectId: "mywallet-11d29",
        storageBucket: "mywallet-11d29.firebasestorage.app",
        messagingSenderId: "249088283797",
        appId: "1:249088283797:web:707c46388467c346b7379c",
        measurementId: "G-LQFQ15FFZJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, "https://mywallet-11d29-default-rtdb.firebaseio.com/");

    window.onload = function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                currentTelegramId = window.Telegram.WebApp.initDataUnsafe.user.id.toString();
            }
        }

        const usersRef = ref(db, 'users');
        onValue(usersRef, (snapshot) => {
            const data = snapshot.val();
            allUsers = data ? data : {};

            if (currentUserName && allUsers[currentUserName]) {
                setupUserSession(currentUserName, false);
            } else if (currentUserName) {
                allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
                saveUsersToCloud();
                setupUserSession(currentUserName, false);
            }
        });
    };

    async function saveUsersToCloud() {
        try {
            await set(ref(db, 'users'), allUsers);
        } catch (e) {
            console.error("خطأ في الحفظ:", e);
        }
    }

    window.registerUser = async function() {
        const inputName = document.getElementById('username-input').value.trim();
        if (!inputName) {
            alert("الرجاء إدخال الاسم!");
            return;
        }
        currentUserName = inputName;
        localStorage.setItem('wallet_current_user_name', currentUserName);

        if (!allUsers[currentUserName]) {
            allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
        }
        await saveUsersToCloud();
        setupUserSession(currentUserName, true);
    }

    function setupUserSession(name, hideLogin) {
        currentUserName = name;
        let currentUser = allUsers[currentUserName];
        if (!currentUser) return;

        if (hideLogin || localStorage.getItem('wallet_current_user_name')) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
        }

        document.querySelector('#welcome-user span').innerText = currentUser.name;
        
        if (currentTelegramId === ADMIN_ID) {
            document.getElementById('admin-panel-btn-container').classList.remove('hidden');
        }

        updatePreviews();
        if (!document.getElementById('admin-panel').classList.contains('hidden')) {
            renderAdminTable();
        }
    }

    window.openWallet = function(type) {
        document.getElementById('main-screen').classList.add('hidden');
        if (type === 'stars') {
            document.getElementById('stars-wallet').classList.remove('hidden');
            updateStarsUI();
        } else {
            document.getElementById('bans-wallet').classList.remove('hidden');
            updateBansUI();
        }
    }

    window.modifyStars = async function(amount) {
        if (!allUsers[currentUserName]) {
            allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
        }
        allUsers[currentUserName].stars += amount;
        if (allUsers[currentUserName].stars < 0) allUsers[currentUserName].stars = 0;
        
        updateStarsUI();
        updatePreviews();
        await saveUsersToCloud();
    }

    window.modifyBans = async function(amount) {
        if (!allUsers[currentUserName]) {
            allUsers[currentUserName] = { name: currentUserName, stars: 0, bans: 0 };
        }
        allUsers[currentUserName].bans += amount;
        if (allUsers[currentUserName].bans < 0) allUsers[currentUserName].bans = 0;
        
        updateBansUI();
        updatePreviews();
        await saveUsersToCloud();
    }

    function updateStarsUI() {
        let u = allUsers[currentUserName];
        if(!u) return;
        document.getElementById('stars-count').innerText = u.stars;
        document.getElementById('stars-symbols').innerText = u.stars > 0 ? "⭐".repeat(u.stars) : "لا توجد نجوم بعد";
    }

    function updateBansUI() {
        let u = allUsers[currentUserName];
        if(!u) return;
        document.getElementById('bans-count').innerText = u.bans;
        document.getElementById('symbols-container-bans').innerText = u.bans > 0 ? "🔴".repeat(u.bans) : "سجل نظيف تماماً";
    }

    function updatePreviews() {
        let u = allUsers[currentUserName];
        if(!u) return;
        document.getElementById('preview-stars').innerText = u.stars;
        document.getElementById('preview-bans').innerText = u.bans;
    }

    window.goBack = function() {
        document.getElementById('stars-wallet').classList.add('hidden');
        document.getElementById('bans-wallet').classList.add('hidden');
        document.getElementById('admin-panel').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        updatePreviews();
    }

    window.openAdminPanel = function() {
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        renderAdminTable();
    }

    function renderAdminTable() {
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = "";
        
        const userKeys = Object.keys(allUsers);
        if (userKeys.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color: var(--light-brown);">لا توجد عضوات مسجلات</td></tr>`;
            return;
        }

        userKeys.forEach((userName) => {
            const user = allUsers[userName];
            tbody.innerHTML += `<tr>
                <td><strong>${user.name}</strong></td>
                <td>⭐ ${user.stars}</td>
                <td>🔴 ${user.bans}</td>
                <td>
                    <div class="action-btns">
                        <button class="btn-secondary mini-btn" onclick="resetUser('${userName}')" title="تصفير">🔄</button>
                        <button class="btn-danger mini-btn" onclick="deleteUser('${userName}')" title="حذف">❌</button>
                    </div>
                </td>
            </tr>`;
        });
    }

    window.resetUser = async function(userName) {
        if (confirm(`تصفير عدادات العضوة: ${userName}؟`)) {
            if(allUsers[userName]) {
                allUsers[userName].stars = 0;
                allUsers[userName].bans = 0;
                await saveUsersToCloud();
                renderAdminTable();
                updatePreviews();
            }
        }
    }

    window.deleteUser = async function(userName) {
        if (confirm(`حذف العضوة "${userName}" تماماً؟`)) {
            delete allUsers[userName];
            await saveUsersToCloud();
            renderAdminTable();
            
            if (currentUserName === userName) {
                localStorage.removeItem('wallet_current_user_name');
                location.reload();
            }
        }
    }
</script>

</body>
</html>
